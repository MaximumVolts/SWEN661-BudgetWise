# Runs every flow in this folder. Subflows are only run from other flows.
# The signed-in flow runs last so the others always start on the Sign in screen.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - "Flutter sign in errors are shown in text"
    - "Flutter create account and reset password links"
    - "Flutter home info buttons and bottom tabs"
