name: pace_app
description: Pace personal finance app - individual screens (unconnected).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path: ^1.9.1
  pdf: ^3.13.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    # The app creates its on-device database from this schema once, and rebuilds it from the
    # schema (keeping its data) when user_version goes up.
    - database/schema.sql
